# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v2.json
# Lenovo Legion G9 2026 (GameSir, 3537:1136) on the Lenovo Legion Tab Y700
# 4th Gen / TB322FC. The ordinary mapping below is reused as-is from the
# upstream Legion G9 3537:1134 map (lenovo_legion_g9), including its event axis
# assignments: right stick on ABS_Z/ABS_RZ, triggers on ABS_BRAKE/ABS_GAS and
# d-pad on ABS_HAT0X/Y.
#
# Firmware 0.14: ABS_X/Y/Z/RZ use 0..65535; ABS_GAS/BRAKE remain 0..255.
# InputPlumber obtains ranges from evdev; this map does not truncate to 8 bits.
# BTN_TRIGGER_HAPPY1..5 are the four paddles and M; their physical order was
# verified on 2026-10-29. Leave paddles unmapped in the Android app.
#
# The 3537:1134 profile's firmware-timing observations have not been verified
# on the 3537:1136 G9 2026 and are not relied on here.
#
# Provenance: https://github.com/enij90/armada-tb321fu/tree/62076530bf1ff34295d671016658965e54e597f1
version: 2
kind: CapabilityMap
name: Lenovo Legion G9 2026
id: lenovo_legion_g9_2026
mapping:
  - name: Guide Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_MODE
          value_type: button
    target_event:
      gamepad:
        button: Guide

  - name: South Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_SOUTH
          value_type: button
    target_event:
      gamepad:
        button: South

  - name: Y Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_WEST
          value_type: button
    target_event:
      gamepad:
        button: West

  - name: X Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_NORTH
          value_type: button
    target_event:
      gamepad:
        button: North

  - name: East Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_EAST
          value_type: button
    target_event:
      gamepad:
        button: East

  - name: Start Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_START
          value_type: button
    target_event:
      gamepad:
        button: Start

  - name: Select Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_SELECT
          value_type: button
    target_event:
      gamepad:
        button: Select

  - name: Right Trigger
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_GAS
          value_type: trigger
    target_event:
      gamepad:
        trigger:
          name: RightTrigger

  - name: Left Trigger
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_BRAKE
          value_type: trigger
    target_event:
      gamepad:
        trigger:
          name: LeftTrigger

  - name: Right Bumper
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TR
          value_type: button
    target_event:
      gamepad:
        button: RightBumper

  - name: Left Bumper
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TL
          value_type: button
    target_event:
      gamepad:
        button: LeftBumper

  - name: Right top paddle
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TRIGGER_HAPPY2
          value_type: button
    target_event:
      gamepad:
        button: RightPaddle1

  - name: Left top paddle
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TRIGGER_HAPPY1
          value_type: button
    target_event:
      gamepad:
        button: LeftPaddle1

  - name: Left bottom paddle
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TRIGGER_HAPPY3
          value_type: button
    target_event:
      gamepad:
        button: LeftPaddle2

  - name: Right bottom paddle
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TRIGGER_HAPPY4
          value_type: button
    target_event:
      gamepad:
        button: RightPaddle2

  - name: M
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TRIGGER_HAPPY5
          value_type: button
    target_event:
      gamepad:
        button: QuickAccess

  - name: Right Stick
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_Z
          value_type: joystick_x
      - evdev:
          event_type: ABS
          event_code: ABS_RZ
          value_type: joystick_y
    target_event:
      gamepad:
        axis:
          name: RightStick

  - name: Left Stick
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_X
          value_type: joystick_x
      - evdev:
          event_type: ABS
          event_code: ABS_Y
          value_type: joystick_y
    target_event:
      gamepad:
        axis:
          name: LeftStick

  - name: Right Stick Click
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_THUMBR
          value_type: button
    target_event:
      gamepad:
        button: RightStick

  - name: Left Stick Click
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_THUMBL
          value_type: button
    target_event:
      gamepad:
        button: LeftStick

  - name: Dpad Left
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_HAT0X
          value_type: button
          axis_direction: negative
    target_event:
      gamepad:
        button: DPadLeft

  - name: Dpad Right
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_HAT0X
          value_type: button
          axis_direction: positive
    target_event:
      gamepad:
        button: DPadRight

  - name: Dpad Down
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_HAT0Y
          value_type: button
          axis_direction: positive
    target_event:
      gamepad:
        button: DPadDown

  - name: Dpad Up
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_HAT0Y
          value_type: button
          axis_direction: negative
    target_event:
      gamepad:
        button: DPadUp

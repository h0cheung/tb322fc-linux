# SPDX-License-Identifier: GPL-2.0-or-later
# Based on mydanyi/armadaos-freedom 2c8c433e, G9 2026 mapping.
# Only the exact Gen4 model and the default (Android) USB identity 3537:1136
# are matched; DS mode (054c:0ce6) has its own config in
# 06-lenovo-y700-gen4-g9-ds.yaml.
#
# The patched 0.14 HID firmware exposes five independent buttons and 16-bit
# stick axes. The vendor motor command also works with stock firmware.
# inputplumber-g9-2026 adds an output-only driver for vendor interface 4;
# both rumble and input disappear together on unplug or switching modes.
# Tablet motors remain outside this composite.
# Tablet sensors are deliberately absent: the existing sensor bridge is shared
# with iio-sensor-proxy and must retain its current readers and units.
version: 1
kind: CompositeDevice
name: Lenovo Legion Y700 Gen4 + Legion G9 2026
matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Lenovo Legion Y700 Gen4
maximum_sources: 0
options:
  auto_manage: true
source_devices:
  - group: gamepad
    evdev:
      name: GameSir Legion Gaming Controller G9 2026
      vendor_id: "3537"
      product_id: "1136"
      handler: event*
    capability_map_id: lenovo_legion_g9_2026
  - group: keyboard
    blocked: true
    evdev:
      name: GameSir Legion Gaming Controller G9 2026 Consumer Control
      vendor_id: "3537"
      product_id: "1136"
      handler: event*
  # Leave the vendor node available to the existing armada-rgb service.
  - group: gamepad
    passthrough: true
    hidraw:
      vendor_id: 0x3537
      product_id: 0x1136
      interface_num: 4
  # Prevent Steam/SDL from also reading the physical gamepad through hidraw.
  - group: gamepad
    blocked: true
    hidraw:
      vendor_id: 0x3537
      product_id: 0x1136
      interface_num: 3
target_devices:
  - deck-uhid
  - keyboard

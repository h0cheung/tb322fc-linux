ARMADA_DEVICE_ID=lenovo-y700-gen4
ARMADA_DEVICE_NAME="Lenovo Legion Y700 Gen 4"
ARMADA_SOC_CLASS=SM8750
ARMADA_SUSPEND_MODE=s2idle
# Controller targets InputPlumber can emulate, in menu order; the first entry is
# the default. The Y700 has no trackpads or IMU feeding InputPlumber, so
# deck-uhid keeps the Steam Deck identity in game mode while xbox-series,
# xb360 and ds5 give KDE an evdev gamepad.
ARMADA_IP_TARGETS=deck-uhid,xbox-series,xb360,ds5

PACKAGE_NAME="als-bridge"
PACKAGE_VERSION="20260929"
BUILT_MODULE_NAME[0]="als-bridge"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
MAKE[0]="make -C /usr/lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build LLVM=1 modules"
CLEAN="make -C /usr/lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build LLVM=1 clean"
# The official headers are unrelated to this device's Freedom kernel.
BUILD_EXCLUSIVE_KERNEL="^[0-9]+[.][0-9]+[.][0-9]+-[0-9]+-freedom$"

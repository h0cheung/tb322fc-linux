name: Build Arch Linux ARM images

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: 'HTTPS firmware bundle URL (or use FIRMWARE_URL secret; see docs/ci.md)'
        type: string
        required: false
      firmware_sha256:
        description: 'Firmware bundle SHA256 (or use FIRMWARE_SHA256 repository variable)'
        type: string
        required: false
      arch_rootfs_url:
        description: 'Arch Linux ARM generic AArch64 archive (verified with its .sig)'
        type: string
        default: http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
      arch_rootfs_sha256:
        description: 'Optional exact archive SHA256 instead of OpenPGP verification'
        type: string
        required: false
      rootfs_size:
        description: 'Raw ext4 image size; must fit the existing rootfs partition'
        type: string
        default: 12G

permissions:
  contents: write

concurrency:
  group: arch-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      ARCH_ROOTFS_URL: ${{ inputs.arch_rootfs_url }}
      ARCH_ROOTFS_SHA256: ${{ inputs.arch_rootfs_sha256 }}
      ROOTFS_SIZE: ${{ inputs.rootfs_size }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check firmware input before installing or building
        env:
          FIRMWARE_URL: ${{ secrets.FIRMWARE_URL || inputs.firmware_url }}
          FIRMWARE_SHA256: ${{ inputs.firmware_sha256 || vars.FIRMWARE_SHA256 }}
        run: bash scripts/ci/prepare-inputs.sh
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 curl bzip2 flex bison bc \
            pkg-config libssl-dev libelf-dev gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            clang lld llvm mkbootimg kmod cpio rsync libarchive-tools e2fsprogs \
            zstd xz-utils gnupg ca-certificates
          # Workaround Ubuntu 24.04 mkbootimg missing gki module (LP: #2058228)
          sudo sed -i 's/from gki.generate_gki_certificate import generate_gki_certificate/generate_gki_certificate = None/' /usr/bin/mkbootimg || true
          sudo python3 -c "import pathlib; p = pathlib.Path('/usr/lib/python3/dist-packages/gki'); p.mkdir(exist_ok=True); (p/'__init__.py').touch(); (p/'generate_gki_certificate.py').write_text('def generate_gki_certificate(*args, **kwargs):\n    pass\n')" || true
          mkbootimg --help >/dev/null
      - name: Fetch and verify pinned sources
        run: python3 scripts/fetch-sources.py
      - name: Download and authenticate Arch Linux ARM
        run: bash scripts/ci/fetch-arch.sh
      - name: Restore kernel build cache
        id: restore-kernel-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            artifacts/boot.img
            artifacts/Image
            artifacts/sm8750-lenovo-elden.dtb
            artifacts/kernel.config
            artifacts/kernel.release
            artifacts/kernel-modules.tar.gz
            artifacts/SHA256SUMS
          key: kernel-${{ hashFiles('sources.json', 'firmware.json', 'configs/**', 'scripts/build-boot.sh', 'scripts/ci/build-kernel.sh', 'tools/avbtool') }}

      - name: Build kernel, embedded initramfs, Android boot image and modules
        if: steps.restore-kernel-cache.outputs.cache-hit != 'true'
        run: JOBS=$(nproc) bash scripts/ci/build-kernel.sh

      - name: Save kernel build cache
        if: steps.restore-kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            artifacts/boot.img
            artifacts/Image
            artifacts/sm8750-lenovo-elden.dtb
            artifacts/kernel.config
            artifacts/kernel.release
            artifacts/kernel-modules.tar.gz
            artifacts/SHA256SUMS
          key: ${{ steps.restore-kernel-cache.outputs.cache-primary-key }}

      - name: Verify kernel build artifacts
        run: |
          for file in boot.img Image sm8750-lenovo-elden.dtb kernel.config kernel.release kernel-modules.tar.gz; do
            [[ -s "artifacts/$file" ]] || { echo "Missing artifacts/$file" >&2; exit 1; }
          done
          echo "Kernel artifacts present and verified:"
          ls -lh artifacts/

      - name: Reclaim kernel build space for rootfs
        run: |
          rm -rf build/kernel build/busybox sources/kernel sources/busybox
          df -h .
      - name: Build Arch rootfs and native device userspace
        run: |
          sudo env ARCH_ROOTFS_ARCHIVE="$PWD/build/ArchLinuxARM-aarch64.tar.gz" \
            ARCH_ROOTFS_SHA256="$(cut -d ' ' -f 1 build/ArchLinuxARM-aarch64.sha256)" \
            ROOTFS_SIZE="$ROOTFS_SIZE" JOBS="$(nproc)" bash scripts/ci/build-rootfs.sh
      - name: Compress images and collect provenance
        run: bash scripts/ci/package.sh
      - name: Upload Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: tb322fc-boot-${{ github.run_id }}
          path: |
            artifacts/release/boot.img.zst
            artifacts/release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Kernel Modules (for upgrade)
        uses: actions/upload-artifact@v4
        with:
          name: tb322fc-kernel-modules-${{ github.run_id }}
          path: |
            artifacts/release/kernel-modules.tar.gz
            artifacts/release/kernel.release
            artifacts/release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Rootfs Image (for fresh install)
        uses: actions/upload-artifact@v4
        with:
          name: tb322fc-rootfs-${{ github.run_id }}
          path: |
            artifacts/release/rootfs.img.zst*
            artifacts/release/SHA256SUMS
            artifacts/release/BUILD-INFO.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb322fc-build-info-${{ github.run_id }}
          path: |
            artifacts/*.txt
            artifacts/*.packages
            artifacts/kernel.config
            artifacts/kernel.release
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish GitHub Pre-Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date -u +'%Y%m%d%H%M%S')"
          KERNEL_RELEASE="$(cat artifacts/release/kernel.release 2>/dev/null || echo '7.2.0-y700+')"
          cat << 'EOF' > artifacts/release/RELEASE-NOTES.md
          # Lenovo Legion Y700 Gen 4 (TB322FC) - Arch Linux ARM Pre-Release

          **Release Tag:** `__TAG__`  
          **Kernel Version:** `__KERNEL_RELEASE__`  
          **Build Date:** __BUILD_DATE__

          ---

          ## 📦 资产下载与说明
          - **首次刷机（全新安装）**：下载 `boot.img.zst` 和 `rootfs.img.zst`（若分卷则下载所有分卷后合并）。
          - **老用户仅升级内核**：仅需下载 `boot.img.zst` 和 `kernel-modules.tar.gz`，**无需重刷 rootfs，个人数据、游戏及配置完全保留**。

          ---

          ## 🚀 首次全新安装指南

          ### 1. 准备 rootfs 分区
          请确保内部存储中存在 GPT 标签为 `rootfs` 的分区：
          ```bash
          lsblk -o NAME,SIZE,PARTLABEL,MOUNTPOINTS
          ```

          ### 2. 解压并写入 rootfs
          ```bash
          # 若文件存在分卷，请先合并：cat rootfs.img.zst.* > rootfs.img.zst
          zstd -d rootfs.img.zst -o rootfs.img

          # 写入平板的 rootfs 分区（请确认目标分区对应设备节点）：
          sudo dd if=rootfs.img of=/dev/disk/by-partlabel/rootfs bs=4M status=progress conv=fsync
          ```

          ### 3. 引导系统
          ```bash
          zstd -d boot.img.zst -o boot.img
          fastboot boot boot.img
          ```

          ---

          ## 🔄 老用户增量升级内核指南

          > [!NOTE]
          > 升级内核不需要重新下载和刷入 `rootfs.img`，所有桌面应用与配置保持原样。

          ### 1. 更新内核模块（在平板系统开机状态下）
          将下载的 `kernel-modules.tar.gz` 传入平板，在终端执行：
          ```bash
          sudo tar -xzf kernel-modules.tar.gz -C /
          sudo depmod -a __KERNEL_RELEASE__
          ```

          ### 2. 引导/固化新内核
          将平板重启至 Fastboot 模式，接电脑执行：
          ```bash
          zstd -d boot.img.zst -o boot.img

          # 临时测试启动：
          fastboot boot boot.img

          # 确认正常开机后固化至当前启动槽位（如 boot_a）：
          fastboot flash boot_a boot.img
          ```
          EOF

          sed -i "s/__TAG__/${TAG}/g" artifacts/release/RELEASE-NOTES.md
          sed -i "s/__KERNEL_RELEASE__/${KERNEL_RELEASE}/g" artifacts/release/RELEASE-NOTES.md
          sed -i "s/__BUILD_DATE__/$(date -u +'%Y-%m-%d %H:%M:%S UTC')/g" artifacts/release/RELEASE-NOTES.md

          echo "Publishing pre-release ${TAG} with assets..."
          assets=()
          for f in artifacts/release/boot.img.zst \
                   artifacts/release/kernel-modules.tar.gz \
                   artifacts/release/rootfs.img.zst* \
                   artifacts/release/SHA256SUMS \
                   artifacts/release/RAW-SHA256SUMS \
                   artifacts/release/BUILD-INFO.txt \
                   artifacts/release/kernel.config \
                   artifacts/release/kernel.release; do
            [[ -e "$f" ]] && assets+=("$f")
          done

          gh release create "${TAG}" \
            --title "Arch Linux ARM Pre-Release (${TAG})" \
            --notes-file artifacts/release/RELEASE-NOTES.md \
            --prerelease \
            "${assets[@]}"

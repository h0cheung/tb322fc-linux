name: Build Freedom Arch packages
on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: 'HTTPS firmware input (prefer FIRMWARE_URL secret)'
        type: string
        required: false
      firmware_sha256:
        description: 'Pinned firmware bundle SHA256'
        type: string
        required: false
      arch_rootfs_url:
        description: 'Authenticated Arch Linux Ports AArch64 bootstrap'
        type: string
        default: https://arch-linux-repo.drzee.net/arch/tarballs/os/aarch64/archlinux-bootstrap-latest-aarch64.tar.zst
      arch_rootfs_sha256:
        description: 'Optional fixed bootstrap SHA256; otherwise verify OpenPGP'
        type: string
        required: false
      rootfs_size:
        description: 'Internal validation rootfs size; not a flashable release image'
        type: string
        default: 20G
permissions:
  contents: write
concurrency:
  group: freedom-packages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      ARCH_ROOTFS_URL: ${{ inputs.arch_rootfs_url }}
      ARCH_ROOTFS_SHA256: ${{ inputs.arch_rootfs_sha256 }}
      ROOTFS_SIZE: ${{ inputs.rootfs_size }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check firmware input
        env:
          FIRMWARE_URL: ${{ secrets.FIRMWARE_URL || inputs.firmware_url }}
          FIRMWARE_SHA256: ${{ inputs.firmware_sha256 || vars.FIRMWARE_SHA256 }}
        run: bash scripts/ci/prepare-inputs.sh
      - name: Install native runner tools
        run: |
          test "$(uname -m)" = aarch64
          sudo apt-get update
          sudo apt-get install -y git python3 python3-yaml curl bzip2 util-linux \
            libarchive-tools e2fsprogs zstd xz-utils gnupg ca-certificates \
            alsa-utils pacman-package-manager jq
      - name: Fetch pinned public userspace and Freedom sources
        run: python3 scripts/fetch-sources.py hexagonrpc libssc libcamera audioreach-topology freedom
      - name: Validate update compatibility before building
        run: |
          python3 scripts/check.py
          sudo python3 -m unittest discover -s tests -v
      - name: Build the tracked audio topology
        run: bash scripts/build-topology.sh
      - name: Authenticate Arch bootstrap
        run: bash scripts/ci/fetch-arch.sh
      - name: Initialize the separate userspace package repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_TAG: repository-freedom-v2
        run: bash scripts/ci/init-repo.sh
      - name: Restore source and compiler caches
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: build/rootfs-cache
          key: freedom-native-v3-${{ runner.arch }}-${{ hashFiles('sources.json', 'configs/**', 'packages/**', 'scripts/ci/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            freedom-native-v3-${{ runner.arch }}-${{ hashFiles('sources.json', 'configs/**', 'packages/**', 'scripts/ci/**') }}-
            freedom-native-v3-${{ runner.arch }}-
      - name: Build native kernel, headers, DKMS, kShim and device packages
        run: |
          sudo env ARCH_ROOTFS_ARCHIVE="$PWD/build/archlinux-aarch64.tar.zst" \
            ARCH_ROOTFS_SHA256="$(cut -d ' ' -f 1 build/archlinux-aarch64.sha256)" \
            ROOTFS_SIZE="$ROOTFS_SIZE" JOBS="$(nproc)" bash scripts/ci/build-rootfs.sh
      - name: Make persistent caches readable to the runner
        if: always() && steps.build-cache.outcome == 'success'
        run: |
          if test -d build/rootfs-cache; then
            sudo chown -R "$(id -u):$(id -g)" build/rootfs-cache
          fi
      - name: Save source and compiler caches, including failed builds
        if: always() && steps.build-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: build/rootfs-cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Validate complete release set
        run: |
          RELEASE_TAG="freedom-v2-$(date -u +'%Y%m%d%H%M%S')"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          RELEASE_TAG="$RELEASE_TAG" bash scripts/ci/package.sh
      - name: Publish separate userspace package repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_TAG: repository-freedom-v2
        run: bash scripts/ci/publish-repo.sh
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freedom-packages-${{ github.run_id }}
          path: artifacts/release/*
          if-no-files-found: error
          compression-level: 0
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freedom-build-info-${{ github.run_id }}
          path: |
            artifacts/*.txt
            artifacts/*.packages
            artifacts/kernel.*
            build/rootfs-cache/*.PKGBUILD
          if-no-files-found: ignore
      - name: Publish complete versioned package release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease \
            --title "Freedom Arch packages $RELEASE_TAG" \
            --notes-file docs/release-notes-v2.md artifacts/release/*
          gh release edit "$RELEASE_TAG" --draft=false
